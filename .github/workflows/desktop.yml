# «حيدرة كت» for the desktop: builds the Mac (.dmg, Apple silicon and Intel in one) and Windows (.exe) programs from
# desktop/ and publishes them as a release. The site's download page links to the latest release's files by their
# fixed names, so a new build reaches everyone without changing the site.
name: Desktop app

on:
  workflow_dispatch:
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

permissions:
  contents: write

concurrency:
  group: desktop-app
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # Apple signing only when its secrets are all there and the certificate reads (a stray or half-filled secret used to
      # stop the build); otherwise the Mac build is signed ad hoc, as package.json says
      - name: Apple signing (when its secrets are complete)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$P12" ] && [ -n "$P12_PASSWORD" ] && [ -n "$TEAM" ] && printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12" 2>/dev/null && [ -s "$RUNNER_TEMP/cert.p12" ]; then
            echo "CSC_LINK=$RUNNER_TEMP/cert.p12" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$P12_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGN_ARGS=-c.mac.identity=$TEAM -c.mac.hardenedRuntime=true" >> "$GITHUB_ENV"
            echo "Signing with the Developer ID certificate"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "Apple signing secrets incomplete: the Mac build is signed ad hoc"
          fi
      - name: Build
        shell: bash
        run: npx electron-builder ${{ matrix.target }} --publish never $SIGN_ARGS
        env:
          # (notarize.js sends the signed Mac build to Apple when these are there too)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: haidara-cut-${{ matrix.os }}
          path: |
            desktop/dist/JAWAD-AI-mac.dmg
            desktop/dist/JAWAD-AI-Setup.exe
          if-no-files-found: error

  release:
    needs: build
    # (a pull request only checks the builds; main publishes)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # the same files under the names the first links used (حيدرة كت), so links already shared keep working
      - name: Copies under the old names
        run: cp out/JAWAD-AI-mac.dmg out/Haidara-Cut-mac.dmg && cp out/JAWAD-AI-Setup.exe out/Haidara-Cut-Setup.exe
      - name: Version
        id: v
        run: echo "tag=desktop-v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "الجواد AI للكمبيوتر · ${{ steps.v.outputs.tag }}"
          make_latest: "true"
          body: |
            برنامج الجواد AI للكمبيوتر (ومعه حيدرة كت للمونتاج).
            - ماك: JAWAD-AI-mac.dmg (أجهزة Apple silicon و Intel)
            - ويندوز: JAWAD-AI-Setup.exe
          files: |
            out/JAWAD-AI-mac.dmg
            out/JAWAD-AI-Setup.exe
            out/Haidara-Cut-mac.dmg
            out/Haidara-Cut-Setup.exe
