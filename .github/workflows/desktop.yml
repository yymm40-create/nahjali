# «حيدرة كت» for the desktop: builds the Mac (.dmg, Apple silicon and Intel in one) and Windows (.exe) programs from
# desktop/ and publishes them as a release. The site's download page links to the latest release's files by their
# fixed names, so a new build reaches everyone without changing the site.
name: Desktop app

on:
  workflow_dispatch:
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

permissions:
  contents: write

concurrency:
  group: desktop-app
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build
        # (with the Developer ID certificate: signed as the team, hardened, then notarized by notarize.js; without it the
        # Mac build stays signed ad hoc, as package.json says)
        run: npx electron-builder ${{ matrix.target }} --publish never ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_P12_BASE64 != '' && format('-c.mac.identity={0} -c.mac.hardenedRuntime=true', secrets.APPLE_TEAM_ID) || '' }}
        env:
          # With the Apple Developer account's secrets (Developer ID certificate + an app-specific password), the Mac
          # build is signed and notarized by Apple and opens without any warning; without them it is signed ad hoc.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12_BASE64 != '' && 'true' || 'false' }}
      - uses: actions/upload-artifact@v4
        with:
          name: haidara-cut-${{ matrix.os }}
          path: |
            desktop/dist/Haidara-Cut-mac.dmg
            desktop/dist/Haidara-Cut-Setup.exe
          if-no-files-found: error

  release:
    needs: build
    # (a pull request only checks the builds; main publishes)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Version
        id: v
        run: echo "tag=desktop-v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "حيدرة كت للكمبيوتر · ${{ steps.v.outputs.tag }}"
          make_latest: "true"
          body: |
            برنامج حيدرة كت للكمبيوتر.
            - ماك: Haidara-Cut-mac.dmg (أجهزة Apple silicon و Intel)
            - ويندوز: Haidara-Cut-Setup.exe
          files: |
            out/Haidara-Cut-mac.dmg
            out/Haidara-Cut-Setup.exe
