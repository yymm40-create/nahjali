<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الجواد AI</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0c0d0c; color: #f4f4f4; font: 16px/1.7 system-ui, "Segoe UI", "SF Arabic", sans-serif; }
  main { text-align: center; max-width: 26rem; padding: 2rem; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { font-size: 1.5rem; margin: 1rem 0 .25rem; }
  p { color: #b8bcb8; margin: 0 0 1.5rem; }
  button { font: inherit; font-weight: 700; padding: .7rem 1.6rem; border: 0; border-radius: 999px; background: #2563eb; color: #fff; cursor: pointer; }
  button:active { transform: scale(.96); }
</style>
</head>
<body>
<main>
  <img src="build/icon.png" alt="">
  <h1>ما فيه اتصال بالإنترنت</h1>
  <p>الجواد AI يحتاج الإنترنت لحسابك وأعمالك ومساعدك حيدرة (ملفاتك نفسها في جهازك وما تنرفع). تأكد من الاتصال وجرّب مرة ثانية.</p>
  <button type="button" onclick="location.href='retry://'">جرّب مرة ثانية</button>
</main>
</body>
</html>
