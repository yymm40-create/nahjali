<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>habits-v1 pages</title>
<!-- Fonts are bundled locally (design/fonts) so rendering works offline -->
<link href="../fonts/fonts.css" rel="stylesheet">
<style>
  /* 1rem = 1mm on a 148mm-wide page rendered at 874 CSS px (x2 scale = 1748px = 300 DPI) */
  html { font-size: 5.905405px; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #ddd; }
  body.all { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; }
  .page {
    position: relative; width: 148rem; height: 210rem; overflow: hidden;
    direction: rtl; font-family: 'Baloo Bhaijaan 2', sans-serif; color: #111;
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) .55rem, transparent .65rem);
    background-size: 7rem 7rem;
  }
  .abs { position: absolute; }
  .card { background: #fff; border: .7rem solid #111; border-radius: 4rem; box-shadow: 1.5rem 1.5rem 0 #111; }
  .title-card { padding: 1rem 6rem 0; transform: rotate(-2deg); font-family: 'Lalezar'; font-size: 15rem; line-height: 1.25; white-space: nowrap; }
  .sub-chip { background: #111; color: #fff; border-radius: 10rem; padding: 1.2rem 4.5rem; font-size: 4.6rem; font-weight: 700; white-space: nowrap; }
  .sticker-text {
    font-family: 'Lalezar'; color: #fff; -webkit-text-stroke: .9rem #111; paint-order: stroke fill;
    text-shadow: 1.6rem 1.6rem 0 #111; line-height: 1;
  }
  .tip { padding: 3rem 4rem 3rem 3.5rem; display: flex; gap: 3rem; align-items: center; }
  .tip .num {
    flex: none; width: 9rem; height: 9rem; border-radius: 50%; border: .6rem solid #111;
    background: var(--accent); display: grid; place-items: center; font-family: 'Lalezar'; font-size: 5.5rem; line-height: 1; padding-top: .8rem; box-sizing: border-box;
  }
  .tip h3 { margin: 0; font-size: 5rem; font-weight: 800; line-height: 1.3; }
  .tip p { margin: .4rem 0 0; font-size: 3.9rem; font-weight: 500; line-height: 1.35; color: #333; }
  .tracker { padding: 3rem 4rem; box-sizing: border-box; }
  .tracker-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.4rem; }
  .tracker-head b { font-family: 'Lalezar'; font-size: 7rem; line-height: 1; padding-top: 1rem; }
  .tracker-head span { font-size: 3.6rem; font-weight: 700; background: var(--accent); border: .5rem solid #111; border-radius: 10rem; padding: .3rem 3rem; }
  .grid28 { display: grid; grid-template-columns: repeat(14, 1fr); row-gap: 4rem; margin-top: 4rem; justify-items: center; }
  .grid28 i {
    width: 8rem; height: 8rem; border-radius: 50%; border: .5rem solid #111;
    font-style: normal; font-size: 3.4rem; font-weight: 700; color: #999; display: grid; place-items: center; padding-top: .5rem;
  }
  .table { display: grid; align-items: center; justify-items: center; row-gap: .9rem; }
  .table .lbl { font-size: 3.4rem; font-weight: 700; justify-self: start; }
  .table .day { font-size: 3rem; font-weight: 700; color: #444; }
  .table .box { width: 5.2rem; height: 5.2rem; border: .5rem solid #111; border-radius: 1.6rem; box-sizing: border-box; }
  .drops { display: grid; grid-template-columns: repeat(2, 4.6rem); gap: 1.3rem 1.6rem; margin-top: 2rem; }
  .badge {
    border-radius: 50%; border: .7rem solid #111; box-shadow: 1.2rem 1.2rem 0 #111;
    display: grid; place-items: center; text-align: center; font-family: 'Lalezar'; line-height: 1.05;
  }
  .medal { display: flex; align-items: center; gap: 3rem; padding: 1.8rem 3rem; }
  .medal .ic { flex: none; width: 11rem; height: 11rem; border-radius: 50%; border: .6rem solid #111; display: grid; place-items: center; box-sizing: border-box; }
  .medal b { flex: 1; font-size: 5rem; font-weight: 800; }
  .medal .box { width: 7rem; height: 7rem; border: .6rem solid #111; border-radius: 1.8rem; box-sizing: border-box; flex: none; }
  .line-row { display: flex; align-items: flex-end; gap: 3rem; font-size: 4.6rem; font-weight: 800; }
  .line-row span { flex: 1; border-bottom: .5rem dashed #111; height: 5rem; }
  /* guides: only in preview mode, never in exported pages */
  .slot-guide { border: .6rem dashed #e11; background: rgba(255,0,0,.06); box-sizing: border-box; display: grid; place-items: center; color: #e11; font-size: 5rem; font-weight: 800; }
  pre { direction: ltr; background: #fff; padding: 12px; font-size: 12px; }
</style>
</head>
<body>
<script>
const P = new URLSearchParams(location.search);
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const DAYS = ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'];

// Simple line icons (24x24 viewBox, black stroke)
const ICON = {
  book: '<path d="M3 5c3-1 6-1 9 1v14c-3-2-6-2-9-1z M21 5c-3-1-6-1-9 1v14c3-2 6-2 9-1z" />',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" />',
  drop: '<path d="M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z" />',
  bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z" />',
  star: '<path d="m12 2.5 2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" />',
  heart: '<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z" />',
  mosque: '<path d="M12 3c2 2 5 3 5 7v1H7v-1c0-4 3-5 5-7z M5 11h14v10H5z M10 21v-5a2 2 0 0 1 4 0v5" />',
  sun: '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" />',
};
const icon = (name, size, fill = 'none') =>
  `<svg width="${size}rem" height="${size}rem" viewBox="0 0 24 24" fill="${fill}" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">${ICON[name]}</svg>`;
const sparkle = (x, y, s, fill, rot = 0) =>
  `<svg class="abs" style="left:${x}rem;top:${y}rem;width:${s}rem;height:${s}rem;transform:rotate(${rot}deg)" viewBox="0 0 24 24"><path d="M12 1c1 6 5 10 11 11-6 1-10 5-11 11-1-6-5-10-11-11C7 11 11 7 12 1z" fill="${fill}" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
const burst = (cx, cy, r, fill) => {
  let pts = [];
  for (let i = 0; i < 32; i++) {
    const rr = i % 2 ? r * 0.82 : r, a = (Math.PI * i) / 16;
    pts.push(`${(cx + rr * Math.cos(a)).toFixed(2)},${(cy + rr * Math.sin(a)).toFixed(2)}`);
  }
  return `<svg class="abs" style="left:0;top:0;width:148rem;height:210rem" viewBox="0 0 148 210"><polygon points="${pts.join(' ')}" fill="${fill}" stroke="#111" stroke-width="0.7" stroke-linejoin="round"/></svg>`;
};
const box = (x, y, w, h, cls, html, extra = '') =>
  `<div class="abs ${cls}" style="left:${x}rem;top:${y}rem;width:${w}rem;${h ? `height:${h}rem;` : ''}${extra}">${html}</div>`;

// Spotlight disc + ground shadow drawn behind each character slot
function spotlight(s, color) {
  const d = s.w * 0.95, cx = s.x + s.w / 2, cy = s.y + s.h * 0.52;
  return `<div class="abs" style="left:${cx - d / 2}rem;top:${cy - d / 2}rem;width:${d}rem;height:${d}rem;border-radius:50%;background:${color};border:.7rem solid #111;box-shadow:1.5rem 1.5rem 0 #111"></div>
    <div class="abs" style="left:${cx - s.w * 0.36}rem;top:${s.y + s.h - 5}rem;width:${s.w * 0.72}rem;height:7rem;border-radius:50%;background:rgba(0,0,0,.22)"></div>`;
}

function tracker28(title, chip) {
  const cells = Array.from({ length: 28 }, (_, i) => `<i>${AR(i + 1)}</i>`).join('');
  return `<div class="tracker-head"><b>${title}</b><span>${chip}</span></div><div class="grid28">${cells}</div>
    <div class="line-row" style="margin-top:4.5rem;font-size:4.2rem">مجموع الأيام<span style="flex:none;width:22rem"></span>من ٢٨</div>`;
}
function trackerPrayer() {
  const names = ['الفجر', 'الظهر', 'العصر', 'المغرب', 'العشاء'];
  let h = `<div></div>` + DAYS.map(d => `<div class="day">${d}</div>`).join('');
  for (const n of names) h += `<div class="lbl">${n}</div>` + DAYS.map(() => `<div class="box"></div>`).join('');
  return `<div class="tracker-head" style="margin-bottom:1.4rem"><b>أسبوعي الذهبي</b><span>علامة لكل صلاة</span></div>
    <div class="table" style="grid-template-columns:16rem repeat(7,1fr)">${h}</div>`;
}
function trackerWater() {
  const drop = `<svg width="4.6rem" height="5.4rem" viewBox="0 0 24 28"><path d="M12 2c5 7 8 11 8 15a8 8 0 0 1-16 0c0-4 3-8 8-15z" fill="none" stroke="#111" stroke-width="2.4"/></svg>`;
  const cols = DAYS.map(d => `<div style="display:flex;flex-direction:column;align-items:center"><div class="day" style="font-size:3rem;font-weight:700">${d}</div><div class="drops">${drop.repeat(8)}</div></div>`).join('');
  return `<div class="tracker-head"><b>عدّاد الموية</b><span>٨ أكواب يوميًا</span></div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr)">${cols}</div>`;
}

// Shared layout for the five habit pages
function habitPage(o) {
  const slot = { pose: o.pose, x: 76, y: 50, w: 64, h: 96 };
  const html = `
    ${o.decor || ''}
    ${spotlight(slot, o.spot)}
    ${box(0, 11, 0, 0, 'card title-card', o.title, 'width:auto;right:9rem;left:auto')}
    ${box(0, 37, 0, 0, 'sub-chip', o.sub, 'width:auto;right:9rem;left:auto')}
    ${o.tips.map((t, i) => box(8, 52 + i * 31.5, 64, 27, 'card tip',
      `<div class="num">${AR(i + 1)}</div><div><h3>${t[0]}</h3><p>${t[1]}</p></div>`)).join('')}
    ${box(8, 149, 132, 54, "card tracker", o.tracker)}
    ${box(6, 6, 22, 22, '', icon(o.icon, 22, o.iconFill), 'transform:rotate(-12deg)')}
  `;
  return { bg: o.bg, dot: o.dot || 'rgba(0,0,0,.09)', accent: o.accent, html, slots: [slot] };
}

const PAGES = [
  // 1 — cover
  (() => {
    const slot = { pose: 'happy', x: 32, y: 78, w: 84, h: 126 };
    const html = `
      ${burst(74, 140, 66, '#FFD23F')}
      ${sparkle(8, 70, 14, '#fff', 10)}${sparkle(124, 62, 11, '#FF4D8D', -8)}${sparkle(126, 190, 10, '#fff')}${sparkle(10, 196, 8, '#C6F432')}
      <div class="abs" style="left:${slot.x + 8}rem;top:${slot.y + slot.h - 6}rem;width:${slot.w - 16}rem;height:8rem;border-radius:50%;background:rgba(0,0,0,.25)"></div>
      ${box(0, 9, 148, 0, '', `<div style="display:flex;justify-content:center"><div class="sub-chip" style="font-size:4.4rem">كتيب العادات اليومية</div></div>`)}
      ${box(0, 22, 148, 0, 'sticker-text', 'عاداتي<br>الخارقة', 'text-align:center;font-size:27rem;transform:rotate(-3deg)')}
      ${box(4, 92, 27, 27, 'badge', '<div style="font-size:6.5rem;padding-top:1.5rem">٥<br>عادات</div>', 'background:#C6F432;transform:rotate(-10deg)')}
      ${box(117, 128, 27, 27, 'badge', '<div style="font-size:6.5rem;padding-top:1.5rem">٢٨<br>يوم</div>', 'background:#FF4D8D;color:#fff;transform:rotate(8deg)')}
      ${box(4, 160, 29, 29, 'badge', '<div style="font-size:5.2rem;padding-top:1.5rem">البطل<br>هنا!</div>', 'background:#fff;transform:rotate(-6deg)')}
    `;
    return { bg: '#7B5CFF', dot: 'rgba(255,255,255,.14)', accent: '#FFD23F', html, slots: [slot] };
  })(),

  // 2 — reading
  habitPage({
    pose: 'reading', bg: '#FFD23F', accent: '#7B5CFF', spot: '#fff', icon: 'book', iconFill: '#fff',
    title: 'قوة القراءة', sub: '١٠ صفحات يوميًا = ١٢ كتاب بالسنة',
    tips: [['كتاب تحبه', 'مو كتاب مفروض… المتعة أول خطوة'], ['وقت ثابت', 'قبل النوم أو بعد العصر، كل يوم'], ['الجوال بعيد', 'والتركيز قريب، ١٥ دقيقة بس']],
    tracker: tracker28('تحدي ٢٨ يوم', 'لوّن الدائرة'),
    decor: sparkle(60, 6, 9, '#fff', 15),
  }),

  // 3 — praying
  habitPage({
    pose: 'praying', bg: '#2EC4B6', accent: '#FFD23F', spot: '#FFF6D6', icon: 'mosque', iconFill: '#FFD23F',
    title: 'صلاتي نوري', sub: 'خمس محطات تشحن يومك',
    tips: [['في وقتها', 'أول ما يأذن… قبل أي شيء ثاني'], ['استعداد مبكر', 'وضوء قبل الأذان بدقائق'], ['لحظة هدوء', 'دعاء قصير بعد كل صلاة']],
    tracker: trackerPrayer(),
    decor: sparkle(60, 5, 9, '#FFD23F', 15),
  }),

  // 4 — eating
  habitPage({
    pose: 'eating', bg: '#FF8A3D', accent: '#C6F432', spot: '#FFE9C7', icon: 'heart', iconFill: '#FF4D8D',
    title: 'وقود البطل', sub: 'أكل ملوّن = طاقة طول اليوم',
    tips: [['نص الصحن ألوان', 'خضار وفواكه في كل وجبة'], ['فطور كل صباح', 'البداية القوية تفرق'], ['الموية صديقتك', 'بدل العصيرات والمشروبات الغازية']],
    tracker: trackerWater(),
    decor: sparkle(60, 6, 9, '#fff', 15),
  }),

  // 5 — exercising
  habitPage({
    pose: 'exercising', bg: '#FF4D8D', accent: '#FFD23F', spot: '#fff', icon: 'bolt', iconFill: '#FFD23F',
    title: 'وقت الحركة', sub: '٣٠ دقيقة يوميًا تصنع الفرق',
    tips: [['أي حركة تُحسب', 'مشي، سباحة، كورة، دراجة'], ['إحماء قبل', 'وموية بعد… دايمًا'], ['الاستمرار أقوى', 'شوي كل يوم أفضل من كثير مرة']],
    tracker: tracker28('تحدي ٢٨ يوم', 'لوّن الدائرة'),
    decor: sparkle(60, 6, 9, '#fff', 15),
  }),

  // 6 — sleeping
  habitPage({
    pose: 'sleeping', bg: '#25206B', dot: 'rgba(255,255,255,.12)', accent: '#FFD23F', spot: '#B9B4FF', icon: 'moon', iconFill: '#FFD23F',
    title: 'نوم الأبطال', sub: 'نوم مبكر = صباح خارق',
    tips: [['الشاشات تنطفي', 'قبل النوم بساعة كاملة'], ['نفس الموعد', 'كل ليلة… حتى في الإجازة'], ['غرفة هادئة', 'مظلمة وباردة شوي']],
    tracker: tracker28('ليالي النوم المبكر', 'لوّن الدائرة'),
    decor: sparkle(60, 6, 9, '#FFD23F', 15) + sparkle(4, 44, 6, '#fff') + sparkle(140, 150 - 9, 6, '#FFD23F'),
  }),

  // 7 — certificate
  (() => {
    const slot = { pose: 'happy', x: 6, y: 52, w: 66, h: 99 };
    const medals = [
      ['وسام القراءة', 'book', '#FFD23F'], ['وسام الصلاة', 'mosque', '#2EC4B6'], ['وسام الطاقة', 'heart', '#FF8A3D'],
      ['وسام الحركة', 'bolt', '#FF4D8D'], ['وسام النوم', 'moon', '#B9B4FF'],
    ];
    const html = `
      ${sparkle(124, 4, 14, '#fff', 12)}${sparkle(6, 6, 10, '#FF4D8D', -10)}${sparkle(66, 40, 8, '#fff')}
      ${spotlight(slot, '#fff')}
      ${box(0, 9, 148, 0, '', `<div style="display:flex;justify-content:center"><div class="card title-card" style="transform:rotate(-2deg)">شهادة إنجاز</div></div>`)}
      ${box(76, 38, 66, 0, 'sticker-text', 'أنجزتها!', 'font-size:15rem;text-align:center;transform:rotate(-4deg)')}
      ${medals.map((m, i) => box(78, 62 + i * 18, 62, 14, 'card medal',
        `<div class="ic" style="background:${m[2]}">${icon(m[1], 6.5, '#fff')}</div><b>${m[0]}</b><div class="box"></div>`, 'border-radius:8rem;box-shadow:1rem 1rem 0 #111')).join('')}
      ${box(8, 160, 132, 40, 'card', `
        <div style="padding:5rem 6rem;display:flex;flex-direction:column;gap:6rem">
          <div class="line-row">التاريخ<span></span></div>
          <div class="line-row">توقيع البطل<span></span></div>
        </div>`)}
    `;
    return { bg: '#C6F432', dot: 'rgba(0,0,0,.08)', accent: '#FFD23F', html, slots: [slot] };
  })(),
];

const TEMPLATE = {
  id: 'habits-v1',
  name: 'كتيب العادات اليومية',
  page_size_mm: { width: 148, height: 210 },
  poses: ['reading', 'praying', 'sleeping', 'eating', 'exercising', 'happy'],
  pages: PAGES.map((p, i) => ({
    file: `pages/page-${String(i + 1).padStart(2, '0')}.png`,
    slots: p.slots.map(s => ({ pose: s.pose, x_mm: s.x, y_mm: s.y, width_mm: s.w, height_mm: s.h })),
  })),
};

function renderPage(p) {
  const guides = P.has('guides')
    ? p.slots.map(s => box(s.x, s.y, s.w, s.h, 'slot-guide', `مكان الشخصية<br>${s.pose}`, 'text-align:center')).join('')
    : '';
  return `<div class="page" style="--bg:${p.bg};--dot:${p.dot};--accent:${p.accent}">${p.html}${guides}</div>`;
}

if (P.has('json')) {
  document.body.innerHTML = `<pre id="json">${JSON.stringify(TEMPLATE, null, 2)}</pre>`;
} else if (P.has('page')) {
  document.body.style.background = 'transparent';
  document.body.innerHTML = renderPage(PAGES[Number(P.get('page')) - 1]);
} else {
  document.body.className = 'all';
  document.body.innerHTML = PAGES.map(renderPage).join('');
}
</script>
</body>
</html>
