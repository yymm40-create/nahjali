<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>nahjali booklet pages</title>
<!-- Fonts are bundled locally (design/fonts) so rendering works offline -->
<link href="../fonts/fonts.css" rel="stylesheet">
<link href="../fonts/amiri.css" rel="stylesheet">
<link href="../fonts/v2.css" rel="stylesheet">
<style>
  /* 1rem = 1mm on a 210mm square page rendered at 1240 CSS px (x2 = 2480px = 300 DPI) */
  html { font-size: 5.904762px; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: transparent; }
  body.all { background: #555; display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; }
  .page { position: relative; width: 210rem; height: 210rem; overflow: hidden; direction: rtl;
    font-family: 'Baloo Bhaijaan 2', sans-serif; color: #0d1d4f; }
  .page.preview:not(.colored) { background: #9ad7e0; }
  .abs { position: absolute; }

  /* ── Palette: lapis navy, turquoise, 3-tone gold, warm ivory, coral accent ── */
  :root { --navy: #0d1d4f; --navy2: #1c3486; --teal: #12a9b8; --gold: #f5b50d; --ivory: #fff8e8; --coral: #ff7a59; }

  /* ── 3D pieces (design/nahjali-v1/assets) stretched with 9-slice borders ── */
  .plaque { display: flex; align-items: center; justify-content: center; text-align: center; padding-top: 1rem;
    border-style: solid; border-image: url(assets/plaque.png) 170 330 fill / 11rem 23rem; filter: drop-shadow(0 1.6rem 1.6rem rgba(9, 20, 60, .45)); }
  .card { border-style: solid; border-image: url(assets/panel.png) 150 fill / 11rem; filter: drop-shadow(0 1.6rem 2rem rgba(9, 20, 60, .4)); }
  .card > .inner { position: absolute; inset: 7rem 7.5rem; }
  .plate { display: flex; align-items: center; justify-content: center; border-style: solid;
    border-image: url(assets/nameplate.png) 170 280 fill / 6.5rem 12rem; filter: drop-shadow(0 1.2rem 1.2rem rgba(0, 0, 0, .35)); }
  .img { position: absolute; object-fit: contain; filter: drop-shadow(0 1.2rem 1.2rem rgba(9, 20, 60, .35)); }

  /* ── Epic 3D lettering (Lemonada): 3-tone gold face + gloss, white outline, navy extrusion, soft shadow ── */
  .t3 { position: relative; display: inline-block; isolation: isolate; font-family: 'Lemonada'; font-weight: 700; line-height: 1.3; white-space: nowrap; }
  .t3::before, .t3::after { content: attr(data-text); position: absolute; inset: 0; }
  .t3::before { z-index: -2; color: var(--navy); -webkit-text-stroke: .2em var(--navy);
    text-shadow: 0 .02em 0 #0d1d4f, 0 .04em 0 #0d1d4f, 0 .06em 0 #0c1b49, 0 .08em 0 #0b1842, 0 .1em 0 #0a163b, 0 .2em .25em rgba(9, 20, 60, .45); }
  .t3::after { z-index: -1; color: #fff; -webkit-text-stroke: .12em #fff; }
  .t3 .face { position: relative; z-index: 1; color: transparent;
    background: linear-gradient(180deg, #fff7cf 0%, #ffe066 22%, #f5b50d 52%, #c97c00 72%, #ffd65c 88%, #fff3b0 100%);
    -webkit-background-clip: text; background-clip: text; }
  .t3 .gloss { position: absolute; inset: 0; z-index: 2; color: transparent;
    background: linear-gradient(180deg, rgba(255,255,255,.85) 0%, rgba(255,255,255,.25) 38%, rgba(255,255,255,0) 44%);
    -webkit-background-clip: text; background-clip: text; }
  .t3.teal .face { background: linear-gradient(180deg, #d9fbff 0%, #5fe6f0 25%, #13b4c4 55%, #087c8c 78%, #4fdbe6 100%); -webkit-background-clip: text; background-clip: text; }
  .t3.navy .face { background: linear-gradient(180deg, #4a6fd8 0%, #20409e 45%, #0d1d4f 100%); -webkit-background-clip: text; background-clip: text; }
  .t3.navy::after { color: #ffd34d; -webkit-text-stroke: .12em #ffd34d; }

  .line { font-size: 6.6rem; font-weight: 800; line-height: 1.45; color: var(--navy); }
  .quote { font-family: 'Amiri', serif; font-size: 4.5rem; line-height: 1.75; color: #0a4f5a; text-align: center; font-weight: 700; }
  .quote.small { font-size: 3.45rem; line-height: 1.7; text-align: justify; font-weight: 400; color: #173058; }
  .quote .mark { color: #d99a0b; font-size: 1.2em; }

  /* 3D chips: turquoise for "even a little", gold for "when?" */
  .chips { display: flex; flex-wrap: wrap; gap: 2rem; }
  .chip { font-size: 3.7rem; font-weight: 800; border-radius: 10rem; padding: .9rem 3.2rem .5rem; white-space: nowrap;
    box-shadow: inset 0 .6rem .4rem rgba(255, 255, 255, .45), 0 .8rem 0 rgba(0, 0, 0, .25), 0 1.4rem 1.6rem rgba(0, 0, 0, .25); }
  .chip.teal { color: #fff; background: linear-gradient(180deg, #5fdde6, #12a3b4 55%, #0b7c8c); border: .5rem solid #f2c14e; text-shadow: 0 .3rem 0 #0b4f63; }
  .chip.gold { color: var(--navy); background: linear-gradient(180deg, #fff1a8, #ffd34d 55%, #e9a50c); border: .5rem solid #fff; }

  /* Tracker: weekly goal (5 of 7) — missing a day is fine */
  .t-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.6rem; }
  .goal { font-family: 'Lemonada'; font-weight: 700; font-size: 5rem; color: var(--navy); }
  .goal b { color: #e08e00; }
  .tracker { display: grid; align-items: center; justify-items: center; row-gap: 1.8rem; }
  .tracker .day { font-size: 2.7rem; font-weight: 800; color: #4a5a80; }
  .tracker .lbl { font-size: 3.5rem; font-weight: 800; justify-self: start; line-height: 1.15; }
  .medal-row { display: flex; align-items: center; justify-content: center; gap: 3rem; margin-top: 3.5rem; font-size: 4.2rem; font-weight: 800; }
  table.grid { border-collapse: separate; border-spacing: 0 1rem; width: 100%; }
  table.grid th { font-size: 2.9rem; font-weight: 800; color: #4a5a80; }
  table.grid td { text-align: center; }
  table.grid td.lbl { text-align: start; font-size: 3.5rem; font-weight: 800; white-space: nowrap; }
  .write-line { border-bottom: .5rem dotted #c79a3a; height: 9rem; }
  .cut { position: absolute; border: .5rem dashed #8a6a2a; border-radius: 50%; }

  /* ── Colourful page backgrounds (design A) with a soft dot pattern ── */
  .page.colored { background-color: var(--bg); background-image: radial-gradient(var(--dot) .55rem, transparent .65rem); background-size: 7rem 7rem; }
  /* Small framed picture (shrine, rooms…): gold frame, turquoise inner line, slight tilt */
  .pic { position: absolute; border-radius: 6rem; padding: 2rem; background: linear-gradient(145deg, #fff3b8, #f5b50d 40%, #c97c00 70%, #ffe27a);
    box-shadow: 0 1.6rem 2.4rem rgba(9, 20, 60, .45), inset 0 .5rem .4rem rgba(255, 255, 255, .6); }
  .pic > img { width: 100%; height: 100%; object-fit: cover; border-radius: 4.4rem; border: .9rem solid #12a9b8; display: block; }
  .sparkle { position: absolute; }

  .slot-guide { border: .6rem dashed #e11; background: rgba(255,0,0,.06); display: grid; place-items: center; color: #e11; font-size: 4.5rem; font-weight: 800; text-align: center; }
  .text-guide { border: .5rem dashed #06c; background: rgba(0,100,255,.1); display: grid; place-items: center; color: #06c; font-size: 3.6rem; font-weight: 800; text-align: center; }
  pre { direction: ltr; background: #fff; padding: 12px; font-size: 12px; }
</style>
</head>
<body>
<script>
const P = new URLSearchParams(location.search);
const DAYS = ['سبت', 'أحد', 'اثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة'];
const AR = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);

const box = (x, y, w, h, cls, html, extra = '') =>
  `<div class="abs ${cls}" style="left:${x}rem;top:${y}rem;width:${w}rem;height:${h}rem;${extra}">${html}</div>`;
const img = (name, x, y, w, h, extra = '') => `<img class="img" src="assets/${name}.png" style="left:${x}rem;top:${y}rem;width:${w}rem;height:${h}rem;${extra}">`;
const star = (s) => `<img src="assets/star.png" style="width:${s}rem;height:${s}rem;object-fit:contain;filter:drop-shadow(0 .4rem .3rem rgba(0,0,0,.25))">`;
const medal = (s) => `<img src="assets/medal.png" style="height:${s}rem;filter:drop-shadow(0 .6rem .5rem rgba(0,0,0,.3))">`;
/** Epic 3D lettering (see .t3) */
const t3 = (text, cls = '') => `<span class="t3 ${cls}" data-text="${text}"><span class="face">${text}</span><span class="gloss" aria-hidden="true">${text}</span></span>`;
const plaque = (x, y, w, h, text, size, cls = '') => box(x, y, w, h, 'plaque', t3(text, cls), `font-size:${size}rem`);

/** Framed picture of a scene (scenes are small framed pictures, not full backgrounds). */
const pic = (scene, x, y, w, h, rot = 0) =>
  `<div class="pic" style="left:${x}rem;top:${y}rem;width:${w}rem;height:${h}rem;transform:rotate(${rot}deg)"><img src="../../templates/nahjali-v1/scenes/${scene}.jpg"></div>`;
const sparkle = (x, y, s, fill, rot = 0) =>
  `<svg class="sparkle" style="left:${x}rem;top:${y}rem;width:${s}rem;height:${s}rem;transform:rotate(${rot}deg)" viewBox="0 0 24 24"><path d="M12 1c1 6 5 10 11 11-6 1-10 5-11 11-1-6-5-10-11-11C7 11 11 7 12 1z" fill="${fill}" stroke="#0d1d4f" stroke-width="1.2" stroke-linejoin="round"/></svg>`;

/** Weekly tracker with a 5-of-7 goal (research: weekly goals beat unbroken streaks). */
function tracker(rows, starSize = rows.length === 1 ? 11 : rows.length === 2 ? 9.6 : 8) {
  const head = `<div></div>` + DAYS.map((d) => `<div class="day">${d}</div>`).join('');
  const body = rows.map((r) => `<div class="lbl">${r}</div>` + DAYS.map(() => `<div>${star(starSize)}</div>`).join('')).join('');
  return `<div class="t-head"><span class="goal">هدفي: <b>٥ من ٧</b> ⭐</span>${medal(9)}</div>
    <div class="tracker" style="grid-template-columns:${rows.some(Boolean) ? '17rem' : '0'} repeat(7, 1fr)">${head}${body}</div>
    <div class="medal-row">${medal(14)} حققت الهدف؟ لوّن الوسام!</div>`;
}

/**
 * Habit page: big title, speech bubble with the child's name (written per order),
 * the child big on the left standing in the scene, info card + weekly tracker on the right.
 */
function habitPage(o) {
  const cardH = o.cardH ?? 46;
  const picH = o.picH ?? 40;
  const cardY = 39 + (picH ? picH + 4 : 0);
  return {
    bg: o.bg,
    dot: o.dot,
    slots: [{ pose: o.pose, x: 0, y: 66, w: 104, h: 142 }],
    texts: [{ value: o.bubble, font: 'hand', color: '#0d1d4f', x: 15, y: 42, w: 76, h: 18, wrap: true }],
    html: `
      ${sparkle(2, 182, 9, '#fff', 12)}${sparkle(94, 194, 7, '#ffd34d', -8)}
      ${plaque(4, 2, 202, 34, o.title, o.titleSize ?? 13)}
      ${img('bubble', 3, 37, 98, 34, 'object-fit:fill')}
      ${picH ? pic(o.scene, 110, 39, 92, picH, 1.5) : ''}
      ${box(106, cardY, 100, cardH, 'card', `<div class="inner" style="inset:6.5rem 7rem;display:flex;flex-direction:column;gap:2.2rem;justify-content:center">
          <div class="line">${o.line}</div>
          <div class="chips">${(o.chips ?? []).map(([cls, t]) => `<span class="chip ${cls}">${t}</span>`).join('')}</div>
          ${o.quote ? `<div class="quote ${o.quoteSmall ? 'small' : ''}">${o.quote}</div>` : ''}
        </div>`)}
      ${box(106, cardY + cardH + 3, 100, 210 - cardY - cardH - 3 - 4, 'card', `<div class="inner" style="inset:6.5rem 6.5rem;display:flex;flex-direction:column;justify-content:center">${tracker(o.rows ?? [''])}</div>`)}
    `,
  };
}

const quran = (t) => `<span class="mark">﴿</span>${t}<span class="mark">﴾</span>`;
const QUOTE_PRAYER = 'إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَّوْقُوتًا';
const QUOTE_NIGHT = 'إِنَّ نَاشِئَةَ اللَّيْلِ هِيَ أَشَدُّ وَطْئًا وَأَقْوَمُ قِيلًا';
const HADITH_MAHDI = 'رُوي عن الحسين بن علي بن أبي طالب (عليه السلام): «منّا اثنا عشر مهديًّا، أوّلهم أمير المؤمنين علي بن أبي طالب، وآخرهم التاسع من ولدي، وهو الإمام القائم بالحق، يُحيي الله به الأرض بعد موتها، ويُظهر به دين الحق على الدين كلّه ولو كره المشركون، له غيبة يرتدّ فيها أقوام ويثبت فيها على الدين آخرون».';
const HABITS_DAILY = ['صلاة الفجر', 'صلاة الظهرين', 'صلاة العشاءين', 'قراءة القرآن', 'تفريش الأسنان', 'ترتيب السرير', 'النوم المبكر', 'الاستيقاظ المبكر', 'السلام على الإمام', 'صلاة الليل', 'المذاكرة'];
const WEEKLY = ['دعاء كميل ليلة الجمعة', 'زيارة الأقارب', 'مساعدة أهلي في البيت', 'صدقة ولو بشيء بسيط', 'زيارة عاشوراء'];
const TIPS = [
  'احتفلوا بالجهد، مو بالكمال.',
  'فات يوم؟ عادي! هدفنا ٥ من ٧، والمهم نكمل بكرة.',
  'ابدأوا بالقليل: ولو آية، ولو ركعة.',
  'اربطوا كل عادة بوقت ثابت في اليوم.',
  'المدح أقوى من الهدايا: قولوا لطفلكم وش عجبكم بالضبط.',
  'خلّوا طفلكم يلوّن ويلصق بنفسه.',
];

// ── Journey map: 28 steps along a winding road from home to the holy shrine ──
const ROUTE = [[150, 186], [112, 190], [74, 186], [42, 174], [24, 152], [32, 130], [60, 118], [92, 118], [116, 104], [112, 86], [88, 80], [70, 70], [92, 58], [120, 52], [138, 42]];
function catmull(pts, n) {
  // Sample n points at equal distances along a smooth curve through pts
  const dense = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for (let t = 0; t < 1; t += 0.02) {
      const t2 = t * t, t3_ = t2 * t;
      dense.push([0, 1].map((k) => 0.5 * (2 * p1[k] + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3_)));
    }
  }
  dense.push(pts[pts.length - 1]);
  const len = [0];
  for (let i = 1; i < dense.length; i++) len.push(len[i - 1] + Math.hypot(dense[i][0] - dense[i - 1][0], dense[i][1] - dense[i - 1][1]));
  const out = [];
  for (let s = 0; s < n; s++) {
    const target = (len[len.length - 1] * s) / (n - 1);
    const j = len.findIndex((l) => l >= target);
    out.push(dense[Math.max(0, j)]);
  }
  return { points: out, dense };
}
function journeyMap() {
  const { points, dense } = catmull(ROUTE, 28);
  const d = `M${dense.map((p) => p.map((v) => v.toFixed(1)).join(' ')).join(' L')}`;
  const road = `<svg class="abs" style="left:0;top:0;width:210rem;height:210rem" viewBox="0 0 210 210">
    <path d="${d}" fill="none" stroke="rgba(60,40,10,.25)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 1.2)"/>
    <path d="${d}" fill="none" stroke="#f6e6bb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${d}" fill="none" stroke="#d1aa5c" stroke-width="0.9" stroke-dasharray="2 2.6"/></svg>`;
  const stones = points.map(([x, y], i) => {
    const n = i + 1;
    if (n % 7 === 0) {
      const s = n === 28 ? 24 : 16;
      return img('medal', x - s / 2, y - s * 0.75, s, s * 1.2);
    }
    const s = 11.5;
    return `${img('stone', x - s / 2, y - s / 2, s, s)}<div class="abs" style="left:${x - s / 2}rem;top:${y - s / 2 + 0.7}rem;width:${s}rem;height:${s}rem;display:grid;place-items:center;font-family:Lemonada;font-weight:700;font-size:4rem;color:#b47a00">${AR(n)}</div>`;
  }).join('');
  return road + stones;
}

// Page colours (design A): one bold colour per page, soft dots
const C = {
  purple: ['#7B5CFF', 'rgba(255,255,255,.14)'], yellow: ['#FFD23F', 'rgba(0,0,0,.08)'], teal: ['#2EC4B6', 'rgba(0,0,0,.08)'],
  orange: ['#FF8A3D', 'rgba(0,0,0,.08)'], pink: ['#FF4D8D', 'rgba(0,0,0,.08)'], navy: ['#25206B', 'rgba(255,255,255,.12)'],
  lime: ['#C6F432', 'rgba(0,0,0,.08)'], sky: ['#5AB8F0', 'rgba(255,255,255,.18)'],
};
const colors = (k) => ({ bg: C[k][0], dot: C[k][1] });

const PAGES = [
  // 1 — cover
  {
    ...colors('purple'),
    slots: [{ pose: 'happy', x: 56, y: 104, w: 98, h: 104 }],
    texts: [{ value: 'كتيب {name}', font: 'title', color: '#0d1d4f', effect: 'epic', x: 8, y: 50, w: 194, h: 32 }],
    html: `
      ${sparkle(6, 10, 14, '#fff', 10)}${sparkle(184, 14, 12, '#FF4D8D', -8)}${sparkle(190, 186, 10, '#fff')}${sparkle(8, 192, 9, '#C6F432')}
      ${pic('shrine-day', 4, 112, 52, 52, -7)}${pic('shrine-night', 154, 116, 52, 52, 7)}
      <img class="img" src="../../public/brand/logo.png" style="left:84rem;top:3rem;width:42rem">
      ${box(38, 82, 134, 16, 'plate', t3('رحلتي مع العادات الطيبة', 'gold'), 'font-size:6.6rem;padding-top:1rem')}
    `,
  },
  // 2 — this is me
  {
    ...colors('orange'),
    slots: [{ pose: 'happy', x: 14, y: 62, w: 76, h: 108, front: true }],
    texts: [
      { value: '{name}', font: 'title', color: '#ffd34d', effect: 'gold', x: 20, y: 181, w: 66, h: 11 },
      { value: '{message}', font: 'hand', color: '#0d1d4f', x: 112, y: 140, w: 84, h: 54, wrap: true },
    ],
    html: `
      ${sparkle(96, 40, 8, '#fff', 15)}${sparkle(2, 196, 9, '#FFD23F')}
      ${plaque(4, 2, 202, 34, 'هذا أنا', 15)}
      ${img('arch', 6, 38, 90, 138, 'object-fit:fill')}
      ${box(8, 178, 86, 17, 'plate', '')}
      ${box(100, 38, 106, 86, 'card', `<div class="inner" style="display:flex;flex-direction:column;gap:3.5rem;justify-content:center">
          ${['عمري:', 'عادتي المفضلة:', 'أحب أن أكون:'].map((l) => `<div style="display:flex;align-items:flex-end;gap:2.5rem"><span class="line" style="white-space:nowrap">${l}</span><span class="write-line" style="flex:1"></span></div>`).join('')}
        </div>`)}
      ${box(100, 127, 106, 79, 'card', `<div class="inner" style="inset:6.5rem 7rem">
          <div style="font-family:Lemonada;font-weight:700;font-size:5.4rem;color:#c0392b;text-align:center">رسالة من ماما وبابا 💛</div>
          ${[0, 1, 2, 3].map(() => `<div class="write-line" style="height:11.5rem;opacity:.55"></div>`).join('')}
        </div>`)}
    `,
  },
  // 3 — journey map (the map illustration stays full-page: it is the content)
  {
    scene: 'journey-map',
    slots: [{ pose: 'happy', x: 164, y: 150, w: 32, h: 46 }],
    texts: [],
    html: `
      ${journeyMap()}
      ${plaque(3, 3, 104, 28, 'رحلتي ٢٨ يوم', 9.5)}
      ${box(6, 32, 98, 12, 'plate', `<span style="font-size:3.6rem;font-weight:800;color:#ffe08a">كل يوم أنجزت فيه عاداتي ألوّن خطوة</span>`)}
    `,
  },
  // 4 — prayers
  habitPage({
    ...colors('teal'), scene: 'prayer-room', pose: 'praying', title: 'صلاتي نوري', bubble: 'يا {name}، حان وقت الصلاة!',
    line: 'أُصلّي صلاتي في وقتها', chips: [['gold', 'متى؟ أول ما يُؤذّن']],
    quote: quran(QUOTE_PRAYER), picH: 34, cardH: 54, rows: ['الفجر', 'الظهرين', 'العشاءين'],
  }),
  // 5 — Quran
  habitPage({
    ...colors('yellow'), scene: 'quran-nook', pose: 'quran', title: 'أقرأ القرآن كل يوم', titleSize: 11.5, bubble: 'يا {name}، يلا نقرأ آية!',
    line: 'كلام الله نورٌ لقلبي', chips: [['teal', 'ولو آيةً واحدة'], ['gold', 'متى؟ بعد صلاة الفجر']], picH: 46, cardH: 44,
  }),
  // 6 — morning
  habitPage({

const TEMPLATE = {
  id: 'nahjali-v1',
  name: 'كتيب نهج علي',
  page_size_mm: { width: 210, height: 210 },
  poses: [...new Set(PAGES.flatMap((p) => p.slots.map((s) => s.pose)))],
  scenes: [...new Set(PAGES.map((p) => p.scene).filter(Boolean))],
  pages: PAGES.map((p, i) => {
    const n = String(i + 1).padStart(2, '0');
    return {
      overlay: `overlays/page-${n}.png`,
      // Coloured pages get a rendered background image (behind the child); the map keeps its full illustration
      scene: p.bg ? `bg-${n}` : p.scene ?? null,
      slots: p.slots.map((s) => ({ pose: s.pose, x_mm: s.x, y_mm: s.y, width_mm: s.w, height_mm: s.h, front: s.front ?? false })),
      texts: p.texts.map((t) => ({ value: t.value, font: t.font, color: t.color, stroke: t.stroke ?? null, effect: t.effect ?? null, wrap: t.wrap ?? false, x_mm: t.x, y_mm: t.y, width_mm: t.w, height_mm: t.h })),
    };
  }),
};

/** mode: "overlay" (transparent content), "bg" (only the coloured background), "preview" (everything + guides). */
function renderPage(p, mode) {
  const colored = p.bg && mode !== 'overlay' ? 'colored' : '';
  const style = p.bg ? `--bg:${p.bg};--dot:${p.dot}` : '';
  if (mode === 'bg') return `<div class="page ${colored}" style="${style}"></div>`;
  const scene = mode === 'preview' && p.scene && !p.bg ? `<img class="abs" src="../../templates/nahjali-v1/scenes/${p.scene}.jpg" style="left:0;top:0;width:210rem;height:210rem">` : '';
  const guides = mode === 'preview'
    ? p.slots.map((s) => box(s.x, s.y, s.w, s.h, 'slot-guide', `الطفل<br>${s.pose}`)).join('') +
      p.texts.map((t) => box(t.x, t.y, t.w, t.h, 'text-guide', t.value)).join('')
    : '';
  return `<div class="page ${colored} ${mode === 'preview' ? 'preview' : ''}" style="${style}">${scene}${p.html}${guides}</div>`;
}

if (P.has('json')) {
  document.body.innerHTML = `<pre id="json">${JSON.stringify(TEMPLATE, null, 2)}</pre>`;
} else if (P.has('page')) {
  const mode = P.get('layer') === 'bg' ? 'bg' : P.has('preview') ? 'preview' : 'overlay';
  document.body.innerHTML = renderPage(PAGES[Number(P.get('page')) - 1], mode);
} else {
  document.body.className = 'all';
  document.body.innerHTML = PAGES.map((p) => renderPage(p, 'preview')).join('');
}
