<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="../fonts/fonts.css" rel="stylesheet">
<link href="../fonts/v2.css" rel="stylesheet">
<style>
  body { margin: 0; padding: 30px; background: #fdf3dc; font-family: 'Baloo Bhaijaan 2'; display: grid; grid-template-columns: 1fr 1fr; gap: 26px; width: 1500px; }
  .cell { background: linear-gradient(180deg, #fff9ea, #f7e6bd); border-radius: 26px; padding: 26px 20px 34px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
  .label { direction: ltr; font: 700 16px system-ui; color: #666; margin-bottom: 10px; }

  /* Epic 3D title: 3-tone gold face + gloss, white outline, navy extrusion, soft drop shadow */
  .t3 { position: relative; display: inline-block; isolation: isolate; font-size: 86px; line-height: 1.35; white-space: nowrap; }
  .t3::before, .t3::after { content: attr(data-text); position: absolute; inset: 0; }
  .t3::before { z-index: -2; color: #0d1d4f; -webkit-text-stroke: .2em #0d1d4f;
    text-shadow: 0 .02em 0 #0d1d4f, 0 .04em 0 #0d1d4f, 0 .06em 0 #0d1d4f, 0 .08em 0 #0b1842, 0 .1em 0 #0a163b, 0 .2em .25em rgba(9, 20, 60, .45); }
  .t3::after { z-index: -1; color: #fff; -webkit-text-stroke: .12em #fff; }
  .t3 .face { position: relative; z-index: 1; color: transparent;
    background: linear-gradient(180deg, #fff7cf 0%, #ffe066 22%, #f5b50d 52%, #c97c00 72%, #ffd65c 88%, #fff3b0 100%);
    -webkit-background-clip: text; background-clip: text; }
  .t3 .gloss { position: absolute; inset: 0; z-index: 2; color: transparent; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.85) 0%, rgba(255,255,255,.25) 38%, rgba(255,255,255,0) 44%);
    -webkit-background-clip: text; background-clip: text; }
  .t3.teal .face { background: linear-gradient(180deg, #d9fbff 0%, #5fe6f0 25%, #13b4c4 55%, #087c8c 78%, #4fdbe6 100%); -webkit-background-clip: text; background-clip: text; }
  .t3.navy .face { background: linear-gradient(180deg, #4a6fd8 0%, #20409e 45%, #0d1d4f 100%); -webkit-background-clip: text; background-clip: text; }
  .t3.navy::after { color: #ffd34d; -webkit-text-stroke: .12em #ffd34d; }

  .bubble { margin-top: 16px; display: inline-block; background: #fff; border: 4px solid #f2c14e; border-radius: 40px; padding: 10px 28px 14px; font-size: 34px; color: #0d1d4f; box-shadow: 0 8px 0 #e3a90f33; }
</style>
</head>
<body>
<script>
const fonts = [
  ['Marhey', 700], ['Lalezar', 400], ['Rakkas', 400], ['Badeen Display', 400], ['Lemonada', 700], ['Reem Kufi', 700],
];
const t3 = (text, cls, font, w) => `<span class="t3 ${cls}" data-text="${text}" style="font-family:'${font}';font-weight:${w}"><span class="face">${text}</span><span class="gloss" aria-hidden="true">${text}</span></span>`;
document.body.innerHTML = fonts.map(([f, w]) => `<div class="cell"><div class="label">${f}</div>
  ${t3('صلاتي نوري', '', f, w)}<br>${t3('أذاكر دروسي', 'teal', f, w)}<br>${t3('شهادة تقدير', 'navy', f, w)}
  <div><span class="bubble" style="font-family:'Playpen Sans Arabic';font-weight:800">يا علي، يلا نصلي الفجر!</span></div></div>`).join('');
</script>
</body>
</html>
