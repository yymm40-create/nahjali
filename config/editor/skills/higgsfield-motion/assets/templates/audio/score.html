<!doctype html><html><head><meta charset="utf-8"><title>Score</title></head><body>
<script>
/* higgsfield-motion score template — original, code-synthesised (no samples, no IP), rendered offline by scripts/render_audio.mjs:
 *   node scripts/render_audio.mjs score.html out.wav --query "preset=pulse&bpm=128&dur=30" [--events film/events.js]
 * Config, lowest to highest priority: defaults → window.FILM (the film's events file) → window.SCORE_CONFIG → ?query.
 *   preset  arrival (formant choir, deep alien calls, taiko, ostinato; the approved Arrival-style score)
 *           | pulse (vocal chops, 16ths, glitch) | organic | luxury (sparse)
 *           | house (French-house bed: four-on-the-floor, Rhodes keys, offbeat bass, sidechain pump)
 *   bpm 120 · dur 30 · drop / vac / lift / end in seconds (defaults scale with dur and snap to beats: 2 / 19.5 / 20 / 28 of 30)
 *   key (semitones from D minor) · seed · pump (sidechain depth 0–0.9; preset default) · motif (1/0) · fills (1/0)
 *   sfx (1/0: events → SFX) · sfxLead (s, default 0: play every SFX earlier, e.g. 0.08 if landings read late)
 * Sections: 0→drop breath · drop→mid pulse A (8ths) · mid→build pulse B (16ths) · build→vac riser · vac→lift vacuum
 *   · lift→end climax · end→dur tail. Climax-level energy from the first drop; the only quiet is the planned vacuum.
 *   Groove changes per chapter, pickup fills into transitions, one recurring 5-note motif, tempo-locked texture.
 * Events: window.FILM = { fps: 24, bpm: 120, dur: 30, events: [{ f: 48, k: 'pop', w: 0.8, note: 'card lands' }, …] }
 *   (f = frame number, or t = seconds; w = weight 0–1.5, default 0.7; dir 'left'|'right'; dur for whoosh/riser/swell).
 *   The picture page loads the same file, so a retime moves picture and sound together.
 *   k = drop | vac | lift | end set the sections. SFX kinds, one tuned family in the key of the bed:
 *   pop / accent (bright glass pop) · click / tick (soft tick) · ding / status (bell) · whoosh / whip / throw (peaks on t)
 *   · riser (ends on t) · impact / hit / slam · swell (reverse swell into t) · tapestop · glitch / stutter · fill (pickup into t).
 *   The same kind always gets the same sound. Unknown kinds are skipped and listed in window.__map.
 * Output: window.__wav (24-bit 48 kHz stereo WAV, peak −1 dBFS), __chunk(i, size), __peak, __sr, __ch, __bits, __dur and
 *   __map, the one-line structure caption to send with the track ('вдох 0–2 → удар 0:02 → … → финальный удар 0:28').
 *   Master the WAV afterwards (scripts/master: −14 LUFS, −1.2 dBTP); this page only normalises the peak. */
(async function () {
  const Q = {}; new URLSearchParams(location.search).forEach((v, k) => { Q[k] = v === '' || isNaN(+v) ? v : +v; });
  const FILM = window.FILM || {};
  const evT = (e) => (e.t != null ? +e.t : +e.f / (FILM.fps || 24));
  const fromFilm = {}; if (FILM.bpm) fromFilm.bpm = +FILM.bpm; if (FILM.dur) fromFilm.dur = +FILM.dur;
  for (const e of FILM.events || []) { const k = String(e.k || '').toLowerCase(); if (['drop', 'vac', 'vacuum', 'lift', 'end'].includes(k)) fromFilm[k === 'vacuum' ? 'vac' : k] = evT(e); }
  const CFG = Object.assign({ preset: 'arrival', bpm: 120, dur: 30.0, key: 0, seed: 7, motif: 1, fills: 1, sfx: 1, sfxLead: 0 }, fromFilm, window.SCORE_CONFIG || {}, Q);
  const SR = 48000, DUR = +CFG.dur;
  if (!(DUR > 0 && DUR <= 600) || !(CFG.bpm >= 40 && CFG.bpm <= 240)) throw new Error(`bad dur ${CFG.dur} or bpm ${CFG.bpm}`);
  const ctx = new OfflineAudioContext(2, Math.round(SR * DUR), SR);
  const BEAT = 60 / CFG.bpm, BAR = 4 * BEAT, snapB = (t) => Math.round(t / BEAT) * BEAT;
  const DROP = CFG.drop ?? Math.max(BEAT, snapB(DUR * 2 / 30)), VAC = CFG.vac ?? snapB(DUR * 0.65), LIFT = CFG.lift ?? VAC + BEAT, END = CFG.end ?? snapB(DUR * 28 / 30);
  if (!(DROP > 0 && DROP < VAC && VAC < LIFT && LIFT <= END && END <= DUR)) throw new Error(`sections must satisfy 0 < drop < vac < lift <= end <= dur, got drop ${DROP} vac ${VAC} lift ${LIFT} end ${END} dur ${DUR}`);
  let ROUTE = null; // when set, out() sends to this bus instead of the music bus (SFX bypass the pump and the vacuum)
  let seed = CFG.seed; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const mf = (m) => 440 * Math.pow(2, (m - 69) / 12);

  // ---------- buses ----------
  const master = ctx.createGain(); master.gain.value = 0.9;
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3.5; comp.attack.value = 0.004; comp.release.value = 0.22; comp.knee.value = 8;
  const pump = ctx.createGain(); master.connect(pump); pump.connect(comp); comp.connect(ctx.destination); // sidechain pump on the music
  const sfxBus = ctx.createGain(); sfxBus.connect(comp);
  const dry = ctx.createGain(); dry.connect(master);
  // reverb IR
  function makeIR(sec, decay) {
    const n = Math.round(SR * sec), b = ctx.createBuffer(2, n, SR);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); let lp = 0; for (let i = 0; i < n; i++) { const t = i / SR; lp = lp * 0.55 + (rnd() * 2 - 1) * 0.45; d[i] = lp * Math.exp(-t / decay) * (t < 0.012 ? t / 0.012 : 1); } }
    return b;
  }
  const verb = ctx.createConvolver(); verb.buffer = makeIR(5.5, 1.25);
  const verbIn = ctx.createGain(); verbIn.connect(verb);
  const wet = ctx.createGain(); wet.gain.value = 0.5; verb.connect(wet); wet.connect(master);
  // vacuum: duck dry + wet at VAC, back at LIFT
  for (const g of [dry.gain, wet.gain]) { const v = g.value; g.setValueAtTime(v, VAC - 0.02); g.linearRampToValueAtTime(0.0, VAC + 0.03); g.setValueAtTime(0.0, LIFT - 0.002); g.linearRampToValueAtTime(v, LIFT); }
  const special = ctx.createGain(); special.connect(master); // un-ducked (reverse breath into the lift)

  // noise buffer
  const NB = ctx.createBuffer(2, SR * 4, SR); for (let c = 0; c < 2; c++) { const d = NB.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1; }
  function noise(t0, t1) { const s = ctx.createBufferSource(); s.buffer = NB; s.loop = true; s.start(t0, rnd() * 3); s.stop(t1); return s; }
  function out(node, { pan = 0, send = 0.3, gain = 1, to = ROUTE || dry } = {}) {
    const g = ctx.createGain(); g.gain.value = gain; const p = ctx.createStereoPanner(); p.pan.value = pan;
    node.connect(g); g.connect(p); p.connect(to); if (send > 0) { const s = ctx.createGain(); s.gain.value = send; p.connect(s); s.connect(verbIn); }
    return g;
  }
  const shaper = (amt) => { const ws = ctx.createWaveShaper(), n = 1024, c = new Float32Array(n); for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; c[i] = Math.tanh(x * amt) / Math.tanh(amt); } ws.curve = c; return ws; };

  // ---------- choir (formant) ----------
  const VOW = { ah: [[800, 1, 9], [1150, 0.55, 11], [2900, 0.22, 14]], oo: [[330, 1, 8], [700, 0.35, 10], [2400, 0.08, 14]], eh: [[480, 1, 9], [1800, 0.5, 12], [2600, 0.25, 14]] };
  // a sustained voice; returns its envelope GainNode so callers can gate it
  function voice(m, t0, t1, { vowel = 'ah', level = 0.12, pan = 0, send = 0.45, att = 0.08, rel = 0.25, to = dry, breath = 0.04 } = {}) {
    const f = mf(m), sum = ctx.createGain(); sum.gain.value = 1;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 4.6 + rnd() * 1.2; const lg = ctx.createGain(); lg.gain.value = f * 0.0045; lfo.connect(lg); lfo.start(t0); lfo.stop(t1 + rel);
    for (const dt of [-9, 0, 8]) { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = dt + (rnd() - 0.5) * 4; lg.connect(o.frequency); o.connect(sum); o.start(t0); o.stop(t1 + rel); }
    if (breath > 0) { const n = noise(t0, t1 + rel); const ng = ctx.createGain(); ng.gain.value = breath * 6; n.connect(ng); ng.connect(sum); }
    const env = ctx.createGain(); env.gain.setValueAtTime(0, t0); env.gain.linearRampToValueAtTime(1, t0 + att); env.gain.setValueAtTime(1, t1); env.gain.linearRampToValueAtTime(0, t1 + rel);
    const shift = m > 64 ? 1.15 : 1.0; const bank = ctx.createGain(); bank.gain.value = level;
    for (const [ff, g, q] of VOW[vowel]) { const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = ff * shift; bp.Q.value = q; const bg = ctx.createGain(); bg.gain.value = g; sum.connect(bp); bp.connect(bg); bg.connect(env); }
    env.connect(bank); out(bank, { pan, send, to });
    return env;
  }
  function chord(notes, t0, t1, o = {}) { return notes.map((m, i) => voice(m, t0, t1, Object.assign({ pan: (i / Math.max(1, notes.length - 1) - 0.5) * (o.width ?? 0.9) }, o))); }
  // gated vocal stabs ("ta ta ta"): one sustained chord, gain gated per hit
  function chops(notes, t0, t1, times, { level = 0.16, vowel = 'ah', decay = 0.045, send = 0.35, accent = () => 1 } = {}) {
    const g = ctx.createGain(); g.gain.setValueAtTime(0, 0);
    for (const tc of times) { if (tc < t0 || tc >= t1) continue; const a = accent(tc); g.gain.setValueAtTime(0, tc); g.gain.linearRampToValueAtTime(a, tc + 0.005); g.gain.setTargetAtTime(0, tc + 0.012, decay); cons(tc, 0.05 * a); }
    const bus = ctx.createGain(); bus.gain.value = 1; g.connect(bus); out(bus, { send, gain: 1 });
    notes.forEach((m, i) => { const env = voice(m, t0, t1, { vowel, level, pan: (i / Math.max(1, notes.length - 1) - 0.5) * 1.1, send: 0, att: 0.01, rel: 0.05, to: g, breath: 0.02 }); });
  }
  function cons(t, lv) { const n = noise(t, t + 0.03); const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 4200; bp.Q.value = 1.2; const g = ctx.createGain(); g.gain.setValueAtTime(lv, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.025); n.connect(bp); bp.connect(g); out(g, { send: 0.1, pan: (rnd() - 0.5) * 0.6 }); }

  // ---------- drums / impacts ----------
  function sub(t, { f0 = 95, f1 = 38, dur = 0.42, lv = 0.9 } = {}) {
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + 0.07);
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(lv, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const ws = shaper(1.8); o.connect(ws); ws.connect(g); out(g, { send: 0.05 }); o.start(t); o.stop(t + dur + 0.05);
    const n = noise(t, t + 0.02); const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2000; const ng = ctx.createGain(); ng.gain.setValueAtTime(0.12 * lv, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.015); n.connect(hp); hp.connect(ng); out(ng, { send: 0 });
  }
  function tom(t, lv = 0.5, f = 110) {
    const o = ctx.createOscillator(); o.frequency.setValueAtTime(f * 1.6, t); o.frequency.exponentialRampToValueAtTime(f * 0.7, t + 0.18);
    const g = ctx.createGain(); g.gain.setValueAtTime(lv, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32); o.connect(g); out(g, { send: 0.25, pan: (rnd() - 0.5) * 0.4 }); o.start(t); o.stop(t + 0.4);
    const n = noise(t, t + 0.12); const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800; const ng = ctx.createGain(); ng.gain.setValueAtTime(lv * 0.35, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.1); n.connect(lp); lp.connect(ng); out(ng, { send: 0.3 });
  }
  function tick(t, lv = 0.05, pan = 0) {
    const n = noise(t, t + 0.02); const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 7500 + rnd() * 2500; bp.Q.value = 2;
    const g = ctx.createGain(); g.gain.setValueAtTime(lv, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.014); n.connect(bp); bp.connect(g); out(g, { send: 0.08, pan });
  }
  function impact(t, size = 1, stab = null) {
    // boom
    const o = ctx.createOscillator(); o.frequency.setValueAtTime(78, t); o.frequency.exponentialRampToValueAtTime(27, t + 1.4);
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1.0 * size, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6 * size + 0.4);
    const ws = shaper(2.6); o.connect(ws); ws.connect(g); out(g, { send: 0.12 }); o.start(t); o.stop(t + 3.2);
    // crack
    const n = noise(t, t + 1.2); const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(6000, t); lp.frequency.exponentialRampToValueAtTime(300, t + 0.9);
    const ng = ctx.createGain(); ng.gain.setValueAtTime(0.55 * size, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 1.0); n.connect(lp); lp.connect(ng); out(ng, { send: 0.6 });
    // low metallic ring (struck plate)
    for (const fr of [55.1, 82.7, 131.3, 176.9]) { const r = ctx.createOscillator(); r.type = 'triangle'; r.frequency.value = fr; const rg = ctx.createGain(); rg.gain.setValueAtTime(0.09 * size, t); rg.gain.exponentialRampToValueAtTime(0.0001, t + 2.2); r.connect(rg); out(rg, { send: 0.5, pan: (rnd() - 0.5) * 0.8 }); r.start(t); r.stop(t + 2.4); }
    sub(t, { f0: 120, f1: 34, dur: 1.1, lv: 1.0 });
    if (stab) chord(stab, t, t + 0.18, { vowel: 'ah', level: 0.2 * size, att: 0.004, rel: 1.4, send: 0.9, width: 1.2 });
  }
  function reverseSwell(tEnd, dur, { lv = 0.5, to = dry, notes = null } = {}) {
    const t0 = tEnd - dur; const n = noise(t0, tEnd); const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.8; bp.frequency.setValueAtTime(400, t0); bp.frequency.exponentialRampToValueAtTime(5000, tEnd);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(lv, tEnd - 0.01); g.gain.linearRampToValueAtTime(0, tEnd); n.connect(bp); bp.connect(g); out(g, { send: 0.2, to });
    if (notes) notes.forEach((m, i) => { const e = voice(m, t0, tEnd - 0.01, { vowel: 'oo', level: 0.0, att: 0.01, rel: 0.01, to, send: 0.1 }); });
  }
  function riser(t0, t1, lv = 0.35) {
    const n = noise(t0, t1); const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 5; bp.frequency.setValueAtTime(250, t0); bp.frequency.exponentialRampToValueAtTime(7000, t1);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(lv, t1); n.connect(bp); bp.connect(g); out(g, { send: 0.4 });
    for (const m of [62, 69, 74]) { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mf(m); o.detune.setValueAtTime(0, t0); o.detune.linearRampToValueAtTime(1200, t1); const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(400, t0); lp.frequency.exponentialRampToValueAtTime(5000, t1); const og = ctx.createGain(); og.gain.setValueAtTime(0.0001, t0); og.gain.exponentialRampToValueAtTime(0.05, t1); o.connect(lp); lp.connect(og); out(og, { send: 0.5, pan: (m - 68) / 8 }); o.start(t0); o.stop(t1); }
  }
  function brass(notes, t0, t1, lv = 0.12) {
    for (const m of notes) for (const dt of [-6, 6]) {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mf(m); o.detune.value = dt;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 2; lp.frequency.setValueAtTime(110, t0); lp.frequency.exponentialRampToValueAtTime(1600, t1 - 0.05);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(lv, t1 - 0.05); g.gain.linearRampToValueAtTime(0, t1);
      o.connect(lp); lp.connect(g); out(g, { send: 0.4, pan: dt / 20 }); o.start(t0); o.stop(t1);
    }
  }
  function drone(t0, t1, notes, lv = 0.12) {
    for (const m of notes) { const o = ctx.createOscillator(); o.type = m < 40 ? 'sine' : 'triangle'; o.frequency.value = mf(m); o.detune.value = (rnd() - 0.5) * 10;
      const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(lv, t0 + 1.2); g.gain.setValueAtTime(lv, t1 - 1.0); g.gain.linearRampToValueAtTime(0, t1);
      const trem = ctx.createOscillator(); trem.frequency.value = 0.18 + rnd() * 0.2; const tg = ctx.createGain(); tg.gain.value = lv * 0.35; trem.connect(tg); tg.connect(g.gain); trem.start(t0); trem.stop(t1);
      o.connect(g); out(g, { send: 0.35, pan: (rnd() - 0.5) * 0.5 }); o.start(t0); o.stop(t1); }
  }


  // ---------- v3 sound design ----------
  function whoosh(t, dur = 0.5, lv = 0.35, dir = 1) {
    const t0 = t - dur; const n = noise(t0, t + 0.25); const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.5;
    bp.frequency.setValueAtTime(dir > 0 ? 300 : 6000, t0); bp.frequency.exponentialRampToValueAtTime(dir > 0 ? 6000 : 300, t + 0.2);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(lv, t - 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    const p = ctx.createStereoPanner(); p.pan.setValueAtTime(-0.9 * dir, t0); p.pan.linearRampToValueAtTime(0.9 * dir, t + 0.25);
    n.connect(bp); bp.connect(g); g.connect(p); p.connect(ROUTE || dry); const sd = ctx.createGain(); sd.gain.value = 0.3; p.connect(sd); sd.connect(verbIn);
  }
  function revCym(tEnd, dur = 0.9, lv = 0.3) {
    const t0 = tEnd - dur; const n = noise(t0, tEnd); const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3500;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(lv, tEnd - 0.005); g.gain.linearRampToValueAtTime(0, tEnd);
    n.connect(hp); hp.connect(g); out(g, { send: 0.25 });
  }
  function glitch(t, notes, len = 0.25, lv = 0.2) {
    const ts = []; for (let x = t; x < t + len - 1e-4; x += 1 / 32 * 2) ts.push(x);
    chops(notes.map((m) => m + 12), t, t + len, ts, { level: lv, decay: 0.012, send: 0.15, accent: (x) => 1 - (x - t) / len * 0.6 });
  }
  function alien(t0, t1, f0, f1, lv = 0.05, pan = 0) {
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t1);
    const rm = ctx.createOscillator(); rm.frequency.value = 37 + rnd() * 20; const rmg = ctx.createGain(); rmg.gain.value = 0;
    const depth = ctx.createGain(); depth.gain.value = 1; rm.connect(depth); depth.connect(rmg.gain);
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(lv, t0 + 0.3); g.gain.setValueAtTime(lv, t1 - 0.4); g.gain.linearRampToValueAtTime(0, t1);
    o.connect(rmg); rmg.connect(g); out(g, { send: 0.8, pan }); o.start(t0); o.stop(t1); rm.start(t0); rm.stop(t1);
  }
  function blips(t0, t1, dens = 6, lv = 0.03) {
    const sc = [74, 76, 79, 81, 86, 88, 91, 93];
    for (let t = t0; t < t1; t += 0.125) { if (rnd() * 8 > dens) continue;
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = mf(sc[Math.floor(rnd() * sc.length)]);
      const g = ctx.createGain(); g.gain.setValueAtTime(lv, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06); o.connect(g); out(g, { send: 0.5, pan: (rnd() - 0.5) * 1.6 }); o.start(t); o.stop(t + 0.08); }
  }
  function tremolo(notes, t0, t1, lv = 0.05, rate = 12) {
    for (const m of notes) for (const dt of [-7, 7]) {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mf(m); o.detune.value = dt;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
      const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(lv, t0 + 0.4); g.gain.setValueAtTime(lv, t1 - 0.1); g.gain.linearRampToValueAtTime(0, t1);
      const tr = ctx.createGain(); tr.gain.value = 0.5; const l = ctx.createOscillator(); l.frequency.value = rate; const lg = ctx.createGain(); lg.gain.value = 0.5; l.connect(lg); lg.connect(tr.gain);
      o.connect(lp); lp.connect(tr); tr.connect(g); out(g, { send: 0.35, pan: dt / 12 }); o.start(t0); o.stop(t1); l.start(t0); l.stop(t1);
    }
  }
  function taiko(t, lv = 0.8) {
    const o = ctx.createOscillator(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(52, t + 0.25);
    const g = ctx.createGain(); g.gain.setValueAtTime(lv, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7); const ws = shaper(2.2); o.connect(ws); ws.connect(g); out(g, { send: 0.35 }); o.start(t); o.stop(t + 0.8);
